name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Android Keystore and Configuration
        run: |
          touch .env
          python3 restore_keystore.py
          # Use google-services.json from repository secret if provided, or copy existing app/google-services.json
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Warning: app/google-services.json not found."
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Verify Generated Signed APK
        id: find_apk
        run: |
          # Use signed debug APK signed with the permanent debug.keystore
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          
          # Verify APK signature scheme and certificate
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose --print-certs "$APK_PATH" | grep -i "b4:8c:a4:55:f4:4b:94:d2:d8:00:62:a7:4e:50:9c:fa:bb:d3:1f:18" || true
          fi

          cp "$APK_PATH" app/build/outputs/apk/monytracker.apk
          cp "$APK_PATH" app/build/outputs/apk/monytracker-v1.2.apk
          echo "APK_PATH=app/build/outputs/apk/monytracker.apk" >> $GITHUB_ENV
          echo "Found and prepared signed APK at $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-app-apk
          path: |
            app/build/outputs/apk/monytracker.apk
            app/build/outputs/apk/monytracker-v1.2.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/monytracker.apk
            app/build/outputs/apk/monytracker-v1.2.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v1.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
