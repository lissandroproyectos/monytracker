name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Android Keystore and Configuration
        run: |
          touch .env
          # Ensure debug.keystore exists and strictly matches the permanent project key
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              python3 -c "import base64; open('debug.keystore','wb').write(base64.b64decode(open('debug.keystore.base64','rb').read().strip()))"
            else
              python3 -c "
import base64
b64 = ''''''
open('debug.keystore', 'wb').write(base64.b64decode(b64.strip()))
"
            fi
          fi

          # Verify fingerprint matches permanent certificate
          FINGERPRINT=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          echo "Verified Keystore SHA1: $FINGERPRINT"
          if [ "$FINGERPRINT" != "B4:8C:A4:55:F4:4B:94:D2:D8:00:62:A7:4E:50:9C:FA:BB:D3:1F:18" ]; then
            echo "ERROR: Keystore SHA1 does not match official B4:8C:A4:55:F4:4B:94:D2:D8:00:62:A7:4E:50:9C:FA:BB:D3:1F:18!"
            exit 1
          fi

          # Ensure google-services.json has authentic OAuth clients and API key for Google Sign-In and Firestore
          if [ ! -f app/google-services.json ] || grep -q '"dummy"' app/google-services.json; then
            python3 -c "import json; data = {'project_info':{'project_number':'166010243644','project_id':'caribbou-net-storage-manager','storage_bucket':'caribbou-net-storage-manager.firebasestorage.app'},'client':[{'client_info':{'mobilesdk_app_id':'1:166010243644:android:3a6b97d46cc88ec4a15139','android_client_info':{'package_name':'com.aistudio.finanzas.kpwrzq'}},'oauth_client':[{'client_id':'166010243644-7rq2p2q4o0qjh2ldlhp985nmo9fncd6i.apps.googleusercontent.com','client_type':1,'android_info':{'package_name':'com.aistudio.finanzas.kpwrzq','certificate_hash':'b48ca455f44b94d2d80062a74e509cfabbd31f18'}},{'client_id':'166010243644-q8chp7cgoo1ltng0fi7u3h8gi9jm8hhr.apps.googleusercontent.com','client_type':3}],'api_key':[{'current_key':'AIzaSyAn5JBiam28MdxM5B9b6vK-D4vzu6Gs0HU'}],'services':{'appinvite_service':{'other_platform_oauth_client':[{'client_id':'166010243644-q8chp7cgoo1ltng0fi7u3h8gi9jm8hhr.apps.googleusercontent.com','client_type':3}]}}}],'configuration_version':'1'}; json.dump(data, open('app/google-services.json', 'w'), indent=2)"
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Verify Generated Signed APK
        id: find_apk
        run: |
          # Use signed debug APK signed with the permanent debug.keystore
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          
          # Verify APK signature scheme and certificate
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose --print-certs "$APK_PATH" | grep -i "b4:8c:a4:55:f4:4b:94:d2:d8:00:62:a7:4e:50:9c:fa:bb:d3:1f:18" || true
          fi

          cp "$APK_PATH" app/build/outputs/apk/monytracker.apk
          cp "$APK_PATH" app/build/outputs/apk/monytracker-v1.2.apk
          echo "APK_PATH=app/build/outputs/apk/monytracker.apk" >> $GITHUB_ENV
          echo "Found and prepared signed APK at $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-app-apk
          path: |
            app/build/outputs/apk/monytracker.apk
            app/build/outputs/apk/monytracker-v1.2.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/monytracker.apk
            app/build/outputs/apk/monytracker-v1.2.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.2.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v1.2.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
