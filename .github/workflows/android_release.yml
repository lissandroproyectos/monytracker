name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Android Keystore and Configuration
        run: |
          touch .env
          # Ensure debug.keystore exists so validateSigningDebug passes
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure google-services.json exists for the Google Services Gradle plugin
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"166010243644","project_id":"caribbou-net-storage-manager","storage_bucket":"caribbou-net-storage-manager.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:166010243644:android:3a6b97d46cc88ec4a15139","android_client_info":{"package_name":"com.aistudio.finanzas.kpwrzq"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace || true
          else
            gradle assembleRelease --stacktrace || true
          fi

      - name: Locate Generated APKs
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-app-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
